name: Build HASHIM Nursing APK from ZIP

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apk.yml'
      - 'HASHIM_Nursing_GitHub_APK_Build_Ready_With_Icon.zip'
      - 'HASHIM_Nursing_GitHub_APK_Build_Ready.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="HASHIM_Nursing_GitHub_APK_Build_Ready_With_Icon.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="HASHIM_Nursing_GitHub_APK_Build_Ready.zip"
          fi

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found in repository root."
            exit 1
          fi

          mkdir -p extracted-project
          unzip -q "$ZIP_FILE" -d extracted-project

          if [ ! -f extracted-project/android-app/settings.gradle ]; then
            echo "ERROR: Android project files not found in extracted ZIP."
            find extracted-project -maxdepth 4 -type f | head -100
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: extracted-project/android-app
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hashim-nursing-debug-apk
          path: extracted-project/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
