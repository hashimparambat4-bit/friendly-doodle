name: Build HASHIM Nursing APK

"on":
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apk.yml'
      - 'HASHIM_Nursing_Royal_Gold_Theme.zip'
      - 'HASHIM_Nursing_Updated_Design.zip'
      - 'HASHIM_Nursing_Fixed_Swipe_Scroll.zip'
      - 'HASHIM_Nursing_Fixed_Screen_Bottom_Navigation.zip'
      - 'HASHIM_Nursing_GitHub_APK_Build_Ready_With_Icon.zip'
      - 'HASHIM_Nursing_GitHub_APK_Build_Ready.zip'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          # Prefer Royal Gold theme, then fall back to older ZIPs.
          for FILE in \
            "HASHIM_Nursing_Royal_Gold_Theme.zip" \
            "HASHIM_Nursing_Updated_Design.zip" \
            "HASHIM_Nursing_Fixed_Swipe_Scroll.zip" \
            "HASHIM_Nursing_Fixed_Screen_Bottom_Navigation.zip" \
            "HASHIM_Nursing_GitHub_APK_Build_Ready_With_Icon.zip" \
            "HASHIM_Nursing_GitHub_APK_Build_Ready.zip"
          do
            if [ -f "$FILE" ]; then
              ZIP_FILE="$FILE"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No supported project ZIP found in the repository root."
            exit 1
          fi

          echo "Using project ZIP: $ZIP_FILE"

          mkdir -p extracted-project
          unzip -q "$ZIP_FILE" -d extracted-project

          SETTINGS_FILE="$(find extracted-project -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle or settings.gradle.kts was not found."
            find extracted-project -maxdepth 5 -type f | head -100
            exit 1
          fi

          ANDROID_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$ANDROID_DIR/app/build.gradle" ] && \
             [ ! -f "$ANDROID_DIR/app/build.gradle.kts" ]; then
            echo "::error::The app module Gradle file was not found."
            exit 1
          fi

          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project directory: $ANDROID_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: ${{ steps.extract.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug

      - name: Find and verify APK
        id: apk
        shell: bash
        env:
          ANDROID_DIR: ${{ steps.extract.outputs.android_dir }}
        run: |
          set -euo pipefail

          APK_PATH="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Debug APK was not generated at the expected location."
            find "$ANDROID_DIR" -type f -name '*.apk' || true
            exit 1
          fi

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "APK generated successfully:"
          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hashim-nursing-debug-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
