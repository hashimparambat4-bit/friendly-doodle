name: Build RAILPREP Nursing APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apk.yml'
      - 'RAILPREP_Nursing_Complete_Fixed_Project.zip'
      - 'RAILPREP_Nursing_Widget_Connected.zip'
      - 'RAILPREP_Nursing_Widget_Connected_With_Workflow.zip'
      - 'HASHIM_Nursing_Royal_Gold_Theme.zip'
      - 'HASHIM_Nursing_Updated_Design.zip'
      - 'HASHIM_Nursing_Fixed_Swipe_Scroll.zip'
      - 'HASHIM_Nursing_Fixed_Screen_Bottom_Navigation.zip'
      - 'HASHIM_Nursing_GitHub_APK_Build_Ready_With_Icon.zip'
      - 'HASHIM_Nursing_GitHub_APK_Build_Ready.zip'

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Download repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Select and extract the latest available project
      - name: Extract Android project
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          for FILE in \
            "RAILPREP_Nursing_Complete_Fixed_Project.zip" \
            "RAILPREP_Nursing_Widget_Connected.zip" \
            "RAILPREP_Nursing_Widget_Connected_With_Workflow.zip" \
            "HASHIM_Nursing_Royal_Gold_Theme.zip" \
            "HASHIM_Nursing_Updated_Design.zip" \
            "HASHIM_Nursing_Fixed_Swipe_Scroll.zip" \
            "HASHIM_Nursing_Fixed_Screen_Bottom_Navigation.zip" \
            "HASHIM_Nursing_GitHub_APK_Build_Ready_With_Icon.zip" \
            "HASHIM_Nursing_GitHub_APK_Build_Ready.zip"
          do
            if [ -f "$FILE" ]; then
              ZIP_FILE="$FILE"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No supported project ZIP was found in the repository root."
            exit 1
          fi

          echo "Selected project: $ZIP_FILE"

          mkdir -p extracted-project
          unzip -q "$ZIP_FILE" -d extracted-project

          SETTINGS_FILE="$(find extracted-project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle settings file not found in the ZIP."
            find extracted-project -maxdepth 5 -type f | head -100
            exit 1
          fi

          ANDROID_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$ANDROID_DIR/app/build.gradle" ] && \
             [ ! -f "$ANDROID_DIR/app/build.gradle.kts" ]; then
            echo "::error::Android app module Gradle file not found."
            exit 1
          fi

          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project directory: $ANDROID_DIR"

          echo "Project structure:"
          ls -la "$ANDROID_DIR"

      # 3. Install Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Configure Gradle
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 5. Check the Android SDK
      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_HOME:-}" ] && \
             [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "::error::Android SDK environment variables are not configured."
            exit 1
          fi

          echo "Android SDK environment:"
          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"

      # 6. Build the Android application
      - name: Build Debug APK
        working-directory: ${{ steps.extract.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      # 7. Locate the generated APK
      - name: Find and verify APK
        id: apk
        shell: bash
        env:
          ANDROID_DIR: ${{ steps.extract.outputs.android_dir }}
        run: |
          set -euo pipefail

          APK_PATH="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            APK_PATH="$(find "$ANDROID_DIR" \
              -type f \
              -path '*/build/outputs/apk/debug/*.apk' \
              -print -quit)"
          fi

          if [ -z "${APK_PATH:-}" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::APK was not generated."
            find "$ANDROID_DIR" -type f -name '*.apk' || true
            exit 1
          fi

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

          echo "APK generated successfully:"
          ls -lh "$APK_PATH"

      # 8. Upload APK as a downloadable artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: railprep-nursing-debug-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
