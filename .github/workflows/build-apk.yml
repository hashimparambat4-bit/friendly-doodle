name: Build HASHIM Nursing APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'HASHIM_Nursing_GitHub_APK_Build_Ready_With_Icon.zip'
      - 'HASHIM_Nursing_GitHub_APK_Build_Ready.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""
          for candidate in \
            "HASHIM_Nursing_GitHub_APK_Build_Ready_With_Icon.zip" \
            "HASHIM_Nursing_GitHub_APK_Build_Ready.zip"; do
            if [ -f "$candidate" ]; then
              ZIP_FILE="$candidate"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Upload the HASHIM Nursing project ZIP to the repository root."
            exit 1
          fi

          mkdir -p extracted-project
          unzip -q "$ZIP_FILE" -d extracted-project

          if [ ! -f extracted-project/android-app/settings.gradle ] || \
             [ ! -f extracted-project/android-app/app/build.gradle ]; then
            echo "::error::The ZIP structure is not as expected. Expected android-app/settings.gradle and android-app/app/build.gradle."
            echo "Files found in ZIP:"
            find extracted-project -maxdepth 4 -type f | head -100
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: extracted-project/android-app
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hashim-nursing-debug-apk
          path: extracted-project/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
