name: Build HASHIM Nursing APK from ZIP

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apk.yml'
      - 'HASHIM_Nursing_Fixed_Swipe_Scroll.zip'
      - 'HASHIM_Nursing_Fixed_Screen_Bottom_Navigation.zip'
      - 'HASHIM_Nursing_GitHub_APK_Build_Ready_With_Icon.zip'
      - 'HASHIM_Nursing_GitHub_APK_Build_Ready.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="HASHIM_Nursing_Fixed_Swipe_Scroll.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="HASHIM_Nursing_Fixed_Screen_Bottom_Navigation.zip"
          fi

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="HASHIM_Nursing_GitHub_APK_Build_Ready_With_Icon.zip"
          fi

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="HASHIM_Nursing_GitHub_APK_Build_Ready.zip"
          fi

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found in repository root."
            exit 1
          fi

          echo "Using project: $ZIP_FILE"

          mkdir -p extracted-project
          unzip -q "$ZIP_FILE" -d extracted-project

          SETTINGS_FILE=$(find extracted-project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android settings.gradle file not found."
            find extracted-project -maxdepth 6 -type f | head -100
            exit 1
          fi

          ANDROID_DIR="${SETTINGS_FILE%/*}"

          if [ ! -f "$ANDROID_DIR/app/build.gradle" ] && \
             [ ! -f "$ANDROID_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android app Gradle build file not found."
            find "$ANDROID_DIR" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project directory: $ANDROID_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: ${{ steps.extract.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        env:
          ANDROID_DIR: ${{ steps.extract.outputs.android_dir }}
        run: |
          set -euo pipefail

          APK_PATH="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            find "$ANDROID_DIR" -type f -name '*.apk'
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hashim-nursing-debug-apk
          path: ${{ steps.extract.outputs.android_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
